<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucles JS</title>
    <meta name="author" content="Benjamin Pardo">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Práctica de Condicionales</h1>
        <div class="card">
            <h2>Ejemplo For 1</h2>
            <p>Contar hasta 5.</p>
            <button onclick="contar()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo For 2</h2>
            <p>Cuenta regresiva.</p>
            <button onclick="cuentaRegresiva()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo For 3</h2>
            <p>Recorrer una lista de usuarios.</p>
            <button onclick="recorrerLista()">Ejecutar</button>
        </div>
        <hr>
        <div class="card">
            <h2>Ejemplo while 1</h2>
            <p>Reproducir musica (booleano)</p>
            <button onclick="musica()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo while 2</h2>
            <p>Carga de datos</p>
            <button onclick="datos()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo while 3</h2>
            <p>Contraseña</p>
            <button onclick="contrasena()">Ejecutar</button>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
