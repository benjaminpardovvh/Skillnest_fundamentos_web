<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Benjamin Pardo">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="header">
        <h1>Social Like</h1>
    </header>
    <main class="container">
        <div class="seccion">
            <aside class="tarjeta">
                <img src="static/img/ness.png" alt="Foto de perfil">
                <p>Ness</p>
                <button class="perfil">Mi perfil</button>
            </aside>
        </div>
        <div class="publicaciones">
            <h2>Últimas publicaciones</h2>
            <article class="publicacion">
                <div class="contenido">
                    <h3>
                        Happy-Happy Village
                    </h3>
                    <p>
                        Una <a href="https://earthbound.fandom.com/es/wiki/Happy_Happy_Village" target="_blank"
                            rel="noopener noreferrer">ciudad</a> de lo mas particular... echale un vistazo
                    </p>
                </div>
                <div class="boton">
                    <p id="likeVillageTexto">0 Like(s)</p>
                    <button class="botonLike" id="likeVillage">Like</button>
                </div>
            </article>
            <article class="publicacion">
                <div class="contenido">
                    <h3>
                        Paula
                    </h3>
                    <p>
                        Mira que <a href="https://earthbound.fandom.com/es/wiki/Ramblin%27_Evil_Mushroom" target="_blank"
                            rel="noopener noreferrer">cosa mas rara</a>, echale un vistazo.
                    </p>
                </div>
                <div class="boton">
                    <p id="likePaulaTexto">0 Like(s)</p>
                    <button class="botonLike" id="likePaula">Like</button>
                </div>
            </article>
            <article class="publicacion">
                <div class="contenido">
                    <h3>
                        Los runaway five
                    </h3>
                    <p>
                        Un grupo muy bueno, <a href="https://www.youtube.com/watch?v=fgAL50414JE&list=PLYp_8WqGUV31fpYu-245ktiJasvMVEzr6&index=1" target="_blank" rel="noopener noreferrer">Escuchalos
                            YA</a>.
                    </p>
                </div>
                <div class="boton">
                    <p id="likeRunawayTexto">0 Like(s)</p>
                    <button class="botonLike" id="likeRunaway">Like</button>
                </div>
            </article>
        </div>
    </main>
    <script src="static/js/script.js" defer></script>
</body>

</html>
